name: Sync rowing data
on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours at :17 UTC
  workflow_dispatch: {}       # manual "sync now" button
  push:
    branches: [main]
permissions:
  contents: write   # the sync job commits data/progress.json
  actions: write    # lets the keepalive step below reset GitHub's 60-day inactivity timer
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run sync
        env:
          C2_TOKEN: ${{ secrets.C2_TOKEN }}
        run: python3 sync.py
      - name: Commit updated data
        run: |
          git config user.name "row-app-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/progress.json
          git diff --cached --quiet || git commit -m "data: sync rowing progress"
          git push
      # GitHub disables scheduled workflows after 60 days without repo commits.
      # Re-enabling an already-enabled workflow resets that timer, so the
      # schedule stays alive without dummy commits (same pattern as the
      # Premierleague repo).
      - name: Keep schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sync.yml/enable"
